# =============================================================
# 教师兼班主任工作台 - Nginx 配置样例
# 使用方式:
#   sudo cp deploy/nginx/nginx.conf.example /etc/nginx/conf.d/teacher_ops.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 假定:
#   - 前端静态资源已复制到 /opt/teacher_ops/frontend/dist
#   - 后端 Node 服务运行在 127.0.0.1:3000
# =============================================================

server {
    listen       80;
    server_name  your-domain.com;   # 改为你的域名或服务器 IP

    # 前端静态资源
    root  /opt/teacher_ops/frontend/dist;
    index index.html;

    # 上传文件较大的资源时需要的体积限制 (示例 100MB)
    client_max_body_size 100m;

    # 静态资源缓存 (带 hash 的构建产物)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router history 模式: 所有路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
    }

    # 上传文件访问 (预览/下载)
    location /uploads/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host $host;
    }
}
