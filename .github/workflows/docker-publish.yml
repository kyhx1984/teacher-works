# 自动化 CI：构建多架构镜像并推送到 GitHub Container Registry (GHCR)
#
# 镜像形态说明：与仓库根目录 Dockerfile 保持一致，产出的是「运行环境镜像」
# （node:22-alpine + 编译工具链 + entrypoint.sh），业务代码仍通过
# docker-compose 的 bind mount 挂载，升级流程不变（解压新代码 -> restart）。
# 用户可跳过本地 docker build，直接 pull 使用，详见 README「从 GHCR 拉取镜像」。
name: 构建镜像并推送到 GHCR

on:
  push:
    branches: [master]
    tags: ['v*']
  # 支持在 Actions 页面手动触发构建
  workflow_dispatch:

# 同一分支/标签仅保留一次构建，避免并发推送互相覆盖
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN 由 GitHub 自动注入，无需配置任何 Secret
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU（跨架构构建支持）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kyhx1984/teacher-works
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: 构建并推送（linux/amd64 + linux/arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
